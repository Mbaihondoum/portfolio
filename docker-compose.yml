# Local stack: PostgreSQL + migrations/seed + the production build of the app.
#   docker compose up --build        → http://localhost:3000
#   docker compose up db             → database only (then `pnpm dev` on the host)
# Port already in use? Put APP_PORT=3001 (and/or DB_PORT=5433) in a `.env` file
# next to this one — Docker Compose reads it automatically.
name: portfolio

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-3000}
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
      NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-3000}
      AUTH_TRUST_HOST: 'true'
      STORAGE_DRIVER: local
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
